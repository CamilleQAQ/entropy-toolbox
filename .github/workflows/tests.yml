name: tests

# Runs on every push to main, on every pull request, and on demand from the
# Actions tab. The public suite is self-contained and platform-independent.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Report every Python version's result, even if one of them fails.
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml (requires-python >=3.10);
        # the newer entry catches NumPy/SciPy API drift against an unpinned
        # dependency set.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Same command the README documents, so CI exercises the documented
      # install path rather than a CI-only one.
      - name: Install (editable, with dev extras)
        run: pip install -e ".[dev]"

      - name: Regression suite
        run: python -m pytest tests/ -q

      # Guards the README's promise that all 15 registry methods run end to end.
      - name: Smoke test (examples/quickstart.py)
        run: python examples/quickstart.py
