# Build system: setuptools is the most widely used and best documented
# backend, and it supports the src layout natively since v61.
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

# Package metadata (PEP 621).
[project]
name = "entropy-toolbox"
version = "0.1.0"
description = "Python toolbox for single-scale and multiscale entropy analysis of time series."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CamilleQAQ" },
]
maintainers = [
    { name = "CamilleQAQ" },
]
keywords = [
    "entropy",
    "time-series",
    "signal-processing",
    "multiscale-entropy",
    "fault-diagnosis",
]
license = "BSD-3-Clause AND CC-BY-4.0"
license-files = [
    "LICENSE",
    "LICENSES/*",
    "THIRD_PARTY_NOTICES.md",
]
dependencies = [
    "numpy",
    "scipy",
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/CamilleQAQ/entropy-toolbox"
Repository = "https://github.com/CamilleQAQ/entropy-toolbox"
Issues = "https://github.com/CamilleQAQ/entropy-toolbox/issues"
Documentation = "https://github.com/CamilleQAQ/entropy-toolbox#readme"

# Development-only dependencies: pytest is needed to run the test suite,
# not at runtime.
[project.optional-dependencies]
dev = [
    "pytest",
]

# src layout: the package lives in src/msentropy.
[tool.setuptools.packages.find]
where = ["src"]

# Central pytest configuration.
[tool.pytest.ini_options]
testpaths = ["tests"]
